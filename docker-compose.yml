version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: checkin_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkin
      POSTGRES_PASSWORD: checkin
      POSTGRES_DB: checkin
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U checkin']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: checkin_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://checkin:checkin@db:5432/checkin
      FRONTEND_URL: http://localhost:3000
    ports:
      - '8000:8000'
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
